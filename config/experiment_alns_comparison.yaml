seed: 2026

generation:
  num_customers: 50
  num_trucks: 3
  num_drones: 2
  region: dense_urban
  instance_reps_per_size: 1
  sizes: [15, 50, 75, 100]

base_class_windows:
  high: [0, 60]
  medium: [0, 120]
  low: [0, 240]

milp:
  enabled: false
  solver: pulp_cbc
  time_limit_seconds: 120
  mip_gap: 0.001
  threads: 1

heuristics:
  nils:
    max_outer_iter: 25
    max_no_improve: 8
    time_limit_seconds: 180
    random_seed: 2026

experiment:
  output_dir: outputs/alns_comparison_beta010
  save_json: true
  save_csv: true
  study_feasibility_policy: feasible_only
  study_force_feasible_outputs: true
  battery_slack_ratio: 0.10
  alns_comparison_methods: [truck_only, nils, feasibility_aware_alns]

  alns_max_iter: 40
  alns_time_limit_seconds: 10
  alns_max_positions_per_route: 3
  alns_max_destroy: 5

  study_grid:
    n: [15, 50, 75, 100]
    eligible_share: [0.25, 0.75]
    endurance: [low, medium, high]
    speed_ratio: [1.25, 2.0]
    handling_time: [short, medium, long]
    spatial_pattern: [uniform, clustered]
    drones_available: [1, 2, 3]
    priority_weight_profile: [flat, moderate, base, strict]
    battery_slack_ratio: [0.10]

  study_conditional_n_by_drones:
    1: [15, 50]
    2: [50, 75]
    3: [75, 100]
