seed: 2026

generation:
  num_customers: 50
  num_trucks: 3
  num_drones: 2
  region: dense_urban
  instance_reps_per_size: 10
  sizes: [50, 75]

base_class_windows:
  high: [0, 60]
  medium: [0, 120]
  low: [0, 240]

milp:
  enabled: false
  solver: cplex
  time_limit_seconds: 120
  mip_gap: 0.001
  threads: 1

heuristics:
  nils:
    max_outer_iter: 25
    max_no_improve: 8
    time_limit_seconds: 180
    random_seed: 2026

experiment:
  output_dir: outputs/fleet_ratio_regime_policy
  save_json: true
  save_csv: true
  study_methods:
    - truck_only
    - paired_baseline
    - no_unpairing
    - nils
    - nils_soft_drone_target
  study_design: d_optimal
  study_d_optimal_points: 48
  study_d_optimal_restarts: 8
  study_reps_per_scenario: 8
  study_feasibility_policy: feasible_only

  # Soft drone-utilization policy variant settings (used by nils_soft_drone_target).
  soft_drone_target_share: 0.20
  soft_drone_target_penalty: 5000.0
  soft_drone_target_seed_offsets: [101, 137]

  study_grid:
    n: [50, 75]
    eligible_share: [0.25, 0.75]
    endurance: [low, medium, high]
    speed_ratio: [1.25, 2.0]
    handling_time: [short, medium, long]
    spatial_pattern: [uniform, clustered]
    drones_available: [1, 2, 3]
    priority_weight_profile: [flat, moderate, base, strict]
    battery_slack_ratio: [0.05, 0.10, 0.15]
