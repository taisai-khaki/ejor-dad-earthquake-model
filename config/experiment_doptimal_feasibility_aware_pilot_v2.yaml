seed: 2026

generation:
  num_customers: 50
  num_trucks: 3
  num_drones: 2
  region: dense_urban
  instance_reps_per_size: 2
  sizes: [15, 50, 75, 100]

base_class_windows:
  high: [0, 60]
  medium: [0, 120]
  low: [0, 240]

milp:
  enabled: false
  solver: cplex
  time_limit_seconds: 120
  mip_gap: 0.001
  threads: 1

heuristics:
  nils:
    max_outer_iter: 25
    max_no_improve: 8
    time_limit_seconds: 90
    random_seed: 2026

experiment:
  output_dir: outputs/doptimal_feasibility_aware_pilot_v2
  save_json: true
  save_csv: true
  study_methods:
    - truck_only
    - simple_drone
    - paired_baseline
    - no_unpairing
    - nils
    - nils_no_local_search
    - nils_no_perturbation
  study_design: d_optimal
  study_d_optimal_points: 24
  study_d_optimal_restarts: 10
  study_reps_per_scenario: 2
  study_feasibility_policy: feasible_only

  study_exclude_conditions:
    - {spatial_pattern: clustered, n_min: 75}
    - {spatial_pattern: clustered, number_of_drones_min: 3}
    - {spatial_pattern: clustered, handling_time: long}

  study_grid:
    n: [15, 50, 75, 100]
    eligible_share: [0.25, 0.75]
    endurance: [low, medium, high]
    speed_ratio: [1.25, 2.0]
    handling_time: [short, medium, long]
    spatial_pattern: [uniform, clustered]
    drones_available: [1, 2, 3]
    priority_weight_profile: [flat, moderate, base, strict]
    battery_slack_ratio: [0.05, 0.10, 0.15, 0.20]

  study_conditional_n_by_drones:
    1: [15, 50]
    2: [50, 75]
    3: [75, 100]
